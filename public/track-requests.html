<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track requests | E-Waste Connect</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/feature-pages.css"><script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("ewaste-theme")==="dark"?"dark":"light")}catch(e){}</script></head><body><header id="nav"></header><main>
<section class="feature-hero"><h1>Track your requests</h1><p>See each disposal request and its latest status in one place.</p></section>
<div class="feature-top"><div><h2 style="margin:0 0 4px">Request activity</h2><div class="muted" id="summary">Loading…</div></div><div class="filter-bar"><button class="active" data-filter="all">All</button><button data-filter="active">In progress</button><button data-filter="completed">Completed</button><button data-filter="rejected">Rejected</button></div></div>
<div class="notice" id="demo-note">Preview mode: sample records are shown until you sign in and the live request API is available.</div><div id="requests"></div>
</main><script src="/js/api.js"></script>
<script>
renderNav();let rows=[],filter='all';const demo=[
{id:'DEMO-1048',status:'processing',mode:'pickup',quantity:2,created_at:Date.now()-3*864e5,updated_at:Date.now()-5*36e5,pickup_address:'Banjara Hills, Hyderabad',centers:{name:'GreenCycle Recycling Centre'},waste_categories:{name:'Mobile Phones'}},
{id:'DEMO-1032',status:'completed',mode:'dropoff',quantity:1,created_at:Date.now()-9*864e5,updated_at:Date.now()-6*864e5,centers:{name:'EcoRestore Hub'},waste_categories:{name:'Laptop / Computer'}},
{id:'DEMO-1051',status:'requested',mode:'dropoff',quantity:4,created_at:Date.now()-8*36e5,updated_at:Date.now()-8*36e5,centers:{name:'GreenCycle Recycling Centre'},waste_categories:{name:'Batteries'}},
{id:'DEMO-1019',status:'rejected',mode:'pickup',quantity:1,created_at:Date.now()-12*864e5,updated_at:Date.now()-11*864e5,centers:{name:'City E-Waste Collection Point'},waste_categories:{name:'Television'}}];
const steps=['requested','accepted','processing','completed'];const names=['Submitted','Accepted','Processing','Completed'];
function date(v){return new Date(v).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function timeline(s){function stamp(h,s){const e=(h||[]).find(x=>x.status===s);return e?`<small style="display:block;font-weight:400;opacity:.8">${date(e.created_at)}</small>`:''}
function timeline(s,h){
  if(s==='rejected')return `<div class="timeline"><div class="timeline-step done">Submitted${stamp(h,'requested')}</div><div class="timeline-step current">Rejected${stamp(h,'rejected')}</div><div class="timeline-step">Processing</div><div class="timeline-step">Completed</div></div>`;
  const n=Math.max(0,steps.indexOf(s));
  return '<div class="timeline">'+steps.map((x,i)=>`<div class="timeline-step ${i<n?'done':i===n?'current':''}">${names[i]}${stamp(h,x)}</div>`).join('')+'</div>';
}}
function draw(){let filtered=rows.filter(r=>filter==='all'||(filter==='active'?['requested','accepted','processing'].includes(r.status):r.status===filter));document.getElementById('summary').textContent=`${rows.length} request${rows.length===1?'':'s'} total`;document.getElementById('requests').innerHTML=filtered.length?filtered.map(r=>`<article class="feature-card"><div class="feature-row"><div><h3>${esc(r.waste_categories?.name||'E-waste')}</h3><div class="feature-meta">${esc(r.centers?.name||'Recycling centre')} · ${esc(r.mode||'dropoff')} · Qty ${Number(r.quantity)||1}</div></div><div><span class="pill ${r.status==='rejected'?'danger':r.status==='completed'?'':'warn'}">${esc(r.status)}</span><div class="feature-meta">#${esc(String(r.id).startsWith('DEMO')?r.id:String(r.id).slice(0,8).toUpperCase())}</div></div></div>${timeline(r.status,r.history)}<div class="feature-meta">Submitted ${date(r.created_at)} · Updated ${date(r.updated_at||r.created_at)}${r.pickup_address?' · '+esc(r.pickup_address):''}</div></article>`).join(''):'<div class="feature-card empty-state"><div class="feature-icon">♻</div><h2>No requests here</h2><p class="muted">Try another filter or submit a disposal request.</p><a class="btn" href="/">Find a centre</a></div>'}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});
(async()=>{if(localStorage.getItem('token')){try{const live=await api('/requests/mine');if(Array.isArray(live)){rows=live;document.getElementById('demo-note').style.display='none';draw();return}}catch(e){document.getElementById('demo-note').textContent='Live requests could not be loaded; sample preview data is shown. '+e.message}}rows=demo;draw()})();
</script></body></html>
