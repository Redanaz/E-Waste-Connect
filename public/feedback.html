<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centre feedback | E-Waste Connect</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/feature-pages.css"></head><body><header id="nav"></header><main>
<section class="feature-hero"><h1>Ratings & feedback</h1><p>Share feedback about a recycling centre after your request has been completed.</p></section>
<div class="notice" id="demo-note">Preview mode: your feedback is saved only in this browser for demonstration. It is not submitted to a centre.</div><section class="feature-card"><h2 style="margin-top:0">Write a review</h2><form id="review-form"><div class="field-grid"><div><label for="centre">Recycling centre</label><select id="centre"><option>GreenCycle Recycling Centre</option><option>EcoRestore Hub</option><option>City E-Waste Collection Point</option></select></div><div><label for="request">Completed request</label><select id="request"><option value="DEMO-1032">DEMO-1032 · Laptop / Computer</option><option value="DEMO-1008">DEMO-1008 · Mobile Phones</option></select></div></div><label>Your rating</label><div class="feedback-stars" id="stars" aria-label="Choose a rating"> <button type="button" data-star="1" aria-label="1 star">★</button><button type="button" data-star="2" aria-label="2 stars">★</button><button type="button" data-star="3" aria-label="3 stars">★</button><button type="button" data-star="4" aria-label="4 stars">★</button><button type="button" data-star="5" aria-label="5 stars">★</button></div><label for="comment">Your feedback</label><textarea id="comment" rows="4" placeholder="Tell others about your experience…" required></textarea><div class="feature-actions" style="margin-top:16px"><button type="submit">Submit feedback</button></div><div id="form-message" class="muted" style="margin-top:12px"></div></form></section><section class="feature-card"><h2 style="margin-top:0">Your feedback</h2><div id="reviews"><p class="muted">No feedback submitted in this preview yet.</p></div></section>
</main><script src="/js/api.js"></script>
<script>renderNav();
requireRole('user');
const centreEl=document.getElementById('centre'),requestEl=document.getElementById('request'),commentEl=document.getElementById('comment'),
  formMessage=document.getElementById('form-message'),reviewsEl=document.getElementById('reviews'),noteEl=document.getElementById('demo-note');
let rating=0,eligible=[];
const stars=[...document.querySelectorAll('[data-star]')];
function paint(){stars.forEach(b=>b.classList.toggle('selected',Number(b.dataset.star)<=rating))}
stars.forEach(b=>b.onclick=()=>{rating=Number(b.dataset.star);paint()});
function syncCentre(){const e=eligible.find(x=>x.request_id===requestEl.value);centreEl.innerHTML=e?`<option>${esc(e.center_name)}</option>`:'<option>No completed requests yet</option>';centreEl.disabled=true}
requestEl.onchange=syncCentre;
function showReviews(list){reviewsEl.innerHTML=list.length?list.map(r=>`<article style="padding:12px 0;border-bottom:1px solid #edf1ec"><div class="feature-row"><strong>${esc(r.centre)}</strong><span style="color:#e5a900">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><div class="feature-meta">${esc(r.request)} · ${esc(r.date)}</div><p style="margin:8px 0 0">${esc(r.comment)}</p></article>`).join(''):'<p class="muted">You have not submitted any feedback yet.</p>'}
async function load(){
  const [elig,mine]=await Promise.all([api('/feedback/eligible'),api('/feedback/mine')]);
  eligible=elig;
  requestEl.innerHTML=elig.length?elig.map(e=>`<option value="${esc(e.request_id)}">${esc(e.category_name)} × ${e.quantity} · ${esc(e.date)}</option>`).join(''):'<option value="">No completed requests to review</option>';
  noteEl.style.display='none';syncCentre();showReviews(mine);
}
document.getElementById('review-form').onsubmit=async e=>{
  e.preventDefault();
  if(!requestEl.value){formMessage.textContent='You need a completed request before leaving feedback.';return}
  if(!rating){formMessage.textContent='Please choose a star rating.';return}
  try{
    await api('/feedback',{method:'POST',body:{request_id:requestEl.value,rating,comment:commentEl.value.trim()}});
    e.target.reset();rating=0;paint();await load();formMessage.textContent='Thank you! Your feedback was submitted.';
  }catch(err){formMessage.textContent=err.message}
};
load().catch(err=>{formMessage.textContent=err.message});</script></body></html>
