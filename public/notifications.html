<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications | E-Waste Connect</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/feature-pages.css"></head><body><header id="nav"></header><main>
<section class="feature-hero"><h1>Notifications</h1><p>Stay up to date when recycling centres respond to your requests.</p></section>
<div class="feature-top"><div><h2 style="margin:0 0 4px">Your updates</h2><div class="muted" id="count">Your latest activity</div></div><div class="feature-actions"><div class="filter-bar"><button class="active" data-filter="all">All</button><button data-filter="unread">Unread</button></div><button class="secondary" id="mark-all">Mark all as read</button></div></div>
<div class="notice" id="demo-note">Preview mode: sample notifications only. They are not sent by the live system.</div><div id="feed"></div>
</main><script src="/js/api.js"></script>
<script>renderNav();let filter='all';let items=[
{id:'n1',title:'Request accepted',body:'GreenCycle Recycling Centre accepted your mobile phone recycling request.',kind:'success',time:'Today · 9:15 AM',unread:true,href:'/track-requests.html'},
{id:'n2',title:'Request submitted',body:'Your battery drop-off request was submitted successfully.',kind:'info',time:'Yesterday · 4:40 PM',unread:true,href:'/track-requests.html'},
{id:'n3',title:'Recycling completed',body:'Your laptop recycling request has been marked completed.',kind:'success',time:'2 days ago',unread:false,href:'/certificates.html'},
{id:'n4',title:'Centre verification update',body:'The centre you selected is verified on E-Waste Connect.',kind:'info',time:'4 days ago',unread:false,href:'/centers.html'}];
function draw(){let shown=items.filter(x=>filter==='all'||x.unread);document.getElementById('count').textContent=`${items.filter(x=>x.unread).length} unread notification${items.filter(x=>x.unread).length===1?'':'s'}`;document.getElementById('feed').innerHTML=shown.length?shown.map(x=>`<article class="feature-card notification ${x.unread?'unread':''}"><div class="feature-icon">${x.kind==='success'?'✓':'♧'}</div><div style="flex:1"><div class="feature-row"><h3>${esc(x.title)}</h3>${x.unread?'<span class="pill">Unread</span>':'<span class="feature-meta">Read</span>'}</div><p>${esc(x.body)}</p><div class="feature-row" style="margin-top:12px"><span class="feature-meta">${esc(x.time)}</span><div class="feature-actions"><button class="secondary" data-read="${x.id}" ${!x.unread?'disabled':''}>Mark read</button><a class="btn" href="${x.href}">Open</a></div></div></div></article>`).join(''):'<div class="feature-card empty-state"><div class="feature-icon">✓</div><h2>All caught up</h2><p class="muted">No unread notifications.</p></div>';document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let x=items.find(n=>n.id===b.dataset.read);if(x)x.unread=false;draw()})}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});document.getElementById('mark-all').onclick=()=>{items.forEach(x=>x.unread=false);draw()};
// Integration contract: GET /api/notifications/mine; PATCH /api/notifications/:id/read; PATCH /api/notifications/read-all.
(async()=>{if(localStorage.getItem('token')){try{let live=await api('/notifications/mine');if(Array.isArray(live)){items=live.map(n=>({...n,unread:!n.read}));document.getElementById('demo-note').style.display='none'}}catch(e){document.getElementById('demo-note').textContent='Live notification API is not connected yet; preview data is shown.'}}draw()})();</script></body></html>
